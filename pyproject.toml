[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nameless"
version = "0.1.0"
description = "The Autonomous Always On Butler"
readme = "README.md"
license = { text = "NA" }
requires-python = ">=3.11"
authors = [{ name = "TPfor1" }]
keywords = ["assistant", "voice", "nameless", "ai", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

# Core dependencies
dependencies = [
    "platformdirs>=4.14.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
    # OS-specific dependencies (only installed on the matching OS)
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=3.41.0"]
ollama = ["ollama>=0.3"]
stt = ["faster-whisper>=1.0"]      # local speech-to-text
tts = ["pyttsx3>=2.90"]            # basic cross-platform text-to-speech
all = [
    "nameless[anthropic,openai,ollama,stt,tts]",
]

[project.scripts]
nameless = "nameless.cli:main"

# Future: third-party fun can register themselves via entry points, e.g.
# [project.entry-points."nameless.fun"]
# my_skill = "nameless_skill_mine:MySkill"

[project.urls]
Homepage = "https://github.com/itstpfor1/nameless"
Issues = "https://github.com/itstpfor1/nameless/issues"

# uv-style dev dependencies (installed by default with `uv sync`)
[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nameless"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplifications
    "PTH",           # prefer pathlib (helps cross-platform)
    "D104",          # missing dock strings are flagged in public packages
    "RUF"            # Ruff
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true



[tool.coverage.run]
source = ["nameless"]
