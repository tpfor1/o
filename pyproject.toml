[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nameless"
version = "0.1.0"
description = "The Dream Personal Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
keywords = ["assistant", "voice", "nameless", "ai", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core dependencies
dependencies = [
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
    # OS-specific dependencies (only installed on the matching OS)
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ollama = ["ollama>=0.3"]
stt = ["faster-whisper>=1.0"]      # local speech-to-text
tts = ["pyttsx3>=2.90"]            # basic cross-platform text-to-speech
all = [
    "nameless[anthropic,openai,ollama,stt,tts]",
]

[project.scripts]
nameless = "nameless.cli:main"

# Future: third-party skills can register themselves via entry points, e.g.
# [project.entry-points."nameless.skills"]
# my_skill = "nameless_skill_mine:MySkill"

[project.urls]
Homepage = "https://github.com/itstpfor1/nameless"
Issues = "https://github.com/itstpfor1/nameless/issues"

# uv-style dev dependencies (installed by default with `uv sync`)
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nameless"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplifications
    "PTH",           # prefer pathlib (helps cross-platform)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
